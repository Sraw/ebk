# Builds the packages on Linux as tools/dist.sh does, then runs the converter that is in them on Windows and
# macOS, where it cannot be run at home, the way a user does (tools/smoke_test.py), and the Rust tests there.
# On a Mac it also builds EBK.app (which needs osacompile and codesign), tries it (tools/macos_app_test.py) and
# makes the macOS package with it: the artifact "ebk-macos".
# A tag v<version> (the version in Cargo.toml) also publishes these packages as a GitHub release: job "release".
name: platforms
on:
  push:
    branches: ["**"]
    # a tag v0.2.0 makes the release v0.2.0; v0.2.0-rc.1 makes a draft pre-release, seen only by the owner
    tags: ["v*"]
    # what these jobs do not run: texts (each run costs about 75 minutes of the quota; not applied to tags)
    paths-ignore: ["spec/**", "**.md"]
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools for building for the other systems
        run: |
          rustup update stable && rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf arm-unknown-linux-musleabi \
            x86_64-pc-windows-gnu x86_64-apple-darwin aarch64-apple-darwin aarch64-linux-android armv7-linux-androideabi
          pip install ziglang==0.15.2 cargo-zigbuild==0.23.4 brotli
      - name: Tests
        run: |
          cargo test --release
          cargo build --release
          python tools/ebk_vectors.py target/release/ebk "$RUNNER_TEMP/vectors" > vectors.log 2>&1 || { grep -E "^FAIL|Traceback" -A5 vectors.log; exit 1; }
          tail -1 vectors.log
      - name: Packages
        run: tools/dist.sh
      - name: The Linux package, as a user uses it
        run: python tools/smoke_test.py dist/ebk-linux/ebk "$RUNNER_TEMP/smoke" crates/ebk/tests/data
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
          retention-days: 14

  run:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, package: ebk-windows, program: ebk.exe }   # x86-64
          - { os: windows-11-arm, package: ebk-windows, program: ebk.exe }   # the same program on ARM Windows
          - { os: macos-latest, package: ebk-macos, program: ebk }           # Apple silicon
          - { os: macos-15-intel, package: ebk-macos, program: ebk }         # Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack as a user would
        run: cd packages && unzip -q ${{ matrix.package }}.zip && ls -l ${{ matrix.package }}
      - name: The packaged program, as a user uses it
        run: python tools/smoke_test.py packages/${{ matrix.package }}/${{ matrix.program }} "$RUNNER_TEMP/smoke" crates/ebk/tests/data
      - name: What macOS says about a program that was downloaded
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          cd packages/${{ matrix.package }}
          file ebk; lipo -archs ebk
          codesign -dv --verbose=2 ebk 2>&1 || true
          spctl --assess --type execute -v ebk 2>&1 || true
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" ebk
          ./ebk --version; echo "started with the mark of a download: exit $?"
      - name: The Rust tests, built here
        run: |
          command -v cargo > /dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; export PATH="$HOME/.cargo/bin:$PATH"; }
          cargo test --release

  macos-app:
    needs: packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: EBK.app
        run: |
          cd packages && unzip -q ebk-macos.zip && cd ..
          tools/dist/macos/build-app.sh packages/ebk-macos/ebk packages/ebk-macos
      - name: EBK.app, as a user uses it
        run: python tools/macos_app_test.py packages/ebk-macos/EBK.app "$RUNNER_TEMP/app"
      - name: The macOS package with EBK.app
        run: |
          cd packages && rm ebk-macos.zip
          ditto -c -k --keepParent ebk-macos ebk-macos.zip
          unzip -l ebk-macos.zip | tail -n 12
      - uses: actions/upload-artifact@v4
        with:
          name: ebk-macos
          path: packages/ebk-macos.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, run, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release
      # the macOS package with EBK.app takes the place of the one without
      - uses: actions/download-artifact@v4
        with:
          name: ebk-macos
          path: release
      - name: The tag names the version that was built
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$TAG" in
            "v$version" | "v$version"-*) echo "version $version, tag $TAG" ;;
            *) echo "the tag $TAG is not v$version (Cargo.toml)"; exit 1 ;;
          esac
      - name: Checksums
        run: cd release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: The release
        run: |
          # the notes are the message of an annotated tag (git tag -a); a plain tag gets notes made by GitHub
          notes=()
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.type)" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha)" -q .message > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          kind=()
          case "$TAG" in *-*) kind=(--draft --prerelease) ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            # made by hand before: the packages are replaced, the rest (notes, the Android app) stays
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "EBK ${TAG#v}" --verify-tag "${kind[@]}" "${notes[@]}"
          fi
          gh release view "$TAG" --json assets -q '.assets[].name'
