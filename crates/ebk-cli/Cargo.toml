[package]
name = "ebk-cli"
description = "Command-line converter and inspector for the EBK e-book container"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ebk_cli"
path = "src/lib.rs"

[[bin]]
name = "ebk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
ebk = { path = "../ebk" }
flate2 = "1.1.10"
roxmltree = "0.21.1"
