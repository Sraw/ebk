[package]
name = "ebk"
description = "Reader and writer for the EBK e-book container"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["write", "jpeg"]
write = ["dep:brotli"]
# storage mode 4: JPEG files recompressed with Lepton
jpeg = ["dep:lepton_jpeg"]

[dependencies]
brotli = { version = "9.0.0", optional = true }
brotli-decompressor = "6.0.1"
crc32fast = "1.5.2"
# the copy in this repository: storage mode 4 is defined by what it decodes (third_party/lepton_jpeg/EBK-CHANGES.md)
lepton_jpeg = { path = "../../third_party/lepton_jpeg", version = "0.5.8", optional = true }
